# This is a Kubernetes Deployment configuration file. It defines a Deployment resource named "cloudship-deployment" in the "cloudship" namespace. The Deployment manages two replicas of the "cloudship" container, which is built from the image "rushipanchal/cloudship:latest". The container exposes port 5000 and uses environment variables from a ConfigMap and a Secret. The Deployment also includes resource requests and limits, as well as liveness and readiness probes to monitor the health of the application. You can apply this configuration to your Kubernetes cluster using the command `kubectl apply -f k8s/deployment.yaml`.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudship-deployment
  namespace: cloudship
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: cloudship
  template:
    metadata:
      labels:
        app: cloudship
    spec:
      containers:
        - name: cloudship
          image: rushipanchal/cloudship:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: cloudship-config
            - secretRef:
                name: cloudship-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
