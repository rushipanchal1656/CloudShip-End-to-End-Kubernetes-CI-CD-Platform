# This is a Kubernetes Ingress configuration file. It defines an Ingress resource named "cloudship-ingress" in the "cloudship" namespace. The Ingress is configured to use an Application Load Balancer (ALB) with specific health check settings and routes traffic to the "cloudship-service" on port 80. You can apply this configuration to your Kubernetes cluster using the command `kubectl apply -f k8s/ingress.yaml`.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudship-ingress
  namespace: cloudship
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
  labels:
    app: cloudship
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudship-service
            port:
              number: 80
