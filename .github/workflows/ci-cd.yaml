# CI/CD workflow for CloudShip application. This GitHub Actions workflow is triggered on every push to the main branch. It performs the following steps: checks out the code, logs in to Docker Hub using secrets, builds a Docker image of the application, pushes the image to Docker Hub, and deploys the updated image to a Kubernetes cluster using SSH. The deployment updates the image of the existing deployment and waits for the rollout to complete.

name: CloudShip End-to-End CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        docker build -t rushipanchal/cloudship:${{ github.sha }} .
        docker tag rushipanchal/cloudship:${{ github.sha }} rushipanchal/cloudship:latest

    - name: Push Docker image
      run: |
        docker push rushipanchal/cloudship:${{ github.sha }}
        docker push rushipanchal/cloudship:latest

    - name: Deploy to Kubernetes
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          kubectl set image deployment/cloudship-deployment \
            cloudship=rushipanchal/cloudship:${{ github.sha }} \
            -n cloudship
          kubectl rollout status deployment/cloudship-deployment -n cloudship
